<!doctype html>
<html lang="zh-CN" data-theme="blueprint">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f8fa" />
    <script>
      (() => {
        try {
          const key = "ai-tiny-codes:calendar-theme";
          const allowed = [
            "blueprint",
            "warm",
            "night",
            "botanical",
            "swiss",
          ];
          const stored = localStorage.getItem(key);
          document.documentElement.dataset.theme = allowed.includes(stored)
            ? stored
            : "blueprint";
        } catch {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>月历</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
